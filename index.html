<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: none;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            min-width: 300px;
        }

        .slider-container {
            margin: 10px 0;
        }

        .slider-container-title {
            justify-content: space-between;
            display: flex;
        }

        .slider {
            width: 100%;
            margin: 8px 0;
        }

        .time-display {
            font-size: 14px;
            margin: 5px 0;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            max-width: 200px;
        }

        .instructions h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .instructions ul {
            margin: 0;
            padding-left: 15px;
        }

        .instructions li {
            margin: 4px 0;
        }
    </style>
</head>

<body>
    <div class="controls">


        <div class="slider-container">
            <div class="slider-container-title">
                <label for="timeSlider">Time control</label>
                <span class="time-display">
                    <span id="currentTime">--:-- <span class="time-display-utc">(--:-- UTC)</span></span>
                </span>
            </div>
            <input type="range" id="timeSlider" class="slider" min="0" max="1440" value="720" step="15">
        </div>
    </div>

    <div class="instructions">
        <h4>Controls</h4>
        <ul>
            <li>Drag to rotate Earth</li>
            <li>Scroll to zoom in/out</li>
            <li>Use slider to change time</li>
        </ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x000000, 1); // Black space background
        document.body.appendChild(renderer.domElement);



        // Earth setup with loading management
        const loadingManager = new THREE.LoadingManager();
        
        loadingManager.onLoad = () => {
            console.log('All textures loaded successfully');
            // Ensure canvas is visible once everything is ready
            renderer.domElement.style.display = 'block';
        };
        
        loadingManager.onError = (url) => {
            console.error('Failed to load texture:', url);
            // Still show canvas even if some textures fail
            renderer.domElement.style.display = 'block';
        };
        
        const textureLoader = new THREE.TextureLoader(loadingManager);

        // Earth geometry with responsive complexity based on device capabilities
        const devicePixelRatio = window.devicePixelRatio || 1;
        const isHighDPI = devicePixelRatio > 1.5;
        const isLargeScreen = window.innerWidth > 1200;
        
        // Adjust geometry complexity: High-DPI/large screens get more detail
        const segments = (isHighDPI && isLargeScreen) ? 64 : (isHighDPI || isLargeScreen) ? 48 : 32;
        console.log(`Using ${segments}x${segments} geometry segments (${segments * segments * 2} triangles) for device`);
        
        const earthGeometry = new THREE.SphereGeometry(5, segments, segments);

        // Load textures with error handling
        const dayTexture = textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
            undefined, // onLoad handled by manager
            undefined, // onProgress
            (err) => console.warn('Day texture failed, using fallback')
        );
        const normalTexture = textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_normal_2048.jpg',
            undefined,
            undefined,
            (err) => console.warn('Normal texture failed, using fallback')
        );
        const specularTexture = textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_specular_2048.jpg',
            undefined,
            undefined,
            (err) => console.warn('Specular texture failed, using fallback')
        );
        const nightTexture = textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_lights_2048.png',
            undefined,
            undefined,
            (err) => console.warn('Night lights texture failed, using fallback')
        );

        // Custom shader material for day/night blending
        const earthMaterial = new THREE.ShaderMaterial({
            uniforms: {
                dayTexture: { value: dayTexture },
                nightTexture: { value: nightTexture },
                normalTexture: { value: normalTexture },
                specularTexture: { value: specularTexture },
                sunDirection: { value: new THREE.Vector3(1, 0, 0) }
            },
            vertexShader: `
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                
                void main() {
                    vUv = uv;
                    vNormal = normalize(normalMatrix * normal);
                    vPosition = position;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D dayTexture;
                uniform sampler2D nightTexture;
                uniform sampler2D normalTexture;
                uniform sampler2D specularTexture;
                uniform vec3 sunDirection;
                
                varying vec2 vUv;
                varying vec3 vNormal;
                varying vec3 vPosition;
                
                void main() {
                    vec4 dayColor = texture2D(dayTexture, vUv);
                    vec4 nightColor = texture2D(nightTexture, vUv);
                    
                    // Use object-space normal and position for lighting calculation
                    // This ensures lighting is fixed to Earth's surface geometry
                    vec3 objectNormal = normalize(vPosition);
                    float sunDot = dot(objectNormal, normalize(sunDirection));
                    
                    // Create smooth transition between day and night
                    float mixFactor = smoothstep(-0.1, 0.1, sunDot);
                    
                    // Blend day and night textures
                    vec4 finalColor = mix(nightColor, dayColor, mixFactor);
                    
                    gl_FragColor = finalColor;
                }
            `
        });

        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        scene.add(earth);

        // Clouds with same responsive geometry as Earth
        const cloudsGeometry = new THREE.SphereGeometry(5.05, segments, segments);
        const cloudTexture = textureLoader.load(
            'https://threejs.org/examples/textures/planets/earth_clouds_1024.png',
            undefined,
            undefined,
            (err) => console.warn('Cloud texture failed, continuing without clouds')
        );
        const cloudsMaterial = new THREE.MeshLambertMaterial({
            map: cloudTexture,
            transparent: true,
            opacity: 0.3
        });
        const clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
        scene.add(clouds);

        // Get user location
        let userLongitude = 18; // Default to Stockholm
        let userLatitude = 59;

        // Time control variables
        let simulatedTime = null;
        const getLocation = () => {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    userLongitude = position.coords.longitude;
                    userLatitude = position.coords.latitude;
                    console.log('Geolocation success: lat:', userLatitude, 'lon:', userLongitude);
                    updateEarthRotation();
                    // Canvas visibility now managed by loading manager
                }, () => {
                    console.log('Geolocation failed, using default');
                    // Default if denied
                    updateEarthRotation();
                    // Canvas visibility now managed by loading manager
                });
            } else {
                console.log('Geolocation not supported');
                updateEarthRotation();
                // Canvas visibility now managed by loading manager
            }
        };

        function getDayOfYear(date) {
            const startUTC = Date.UTC(date.getUTCFullYear(), 0, 1);
            const nowUTC = Date.UTC(
                date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(),
                date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()
            );
            const oneDay = 1000 * 60 * 60 * 24;
            return Math.floor((nowUTC - startUTC) / oneDay) + 1;
        }

        function updateEarthRotation() {
            // Center user's longitude at camera by yawing Earth
            earth.rotation.y = - (Math.PI / 2) - (userLongitude * Math.PI / 180);
            earth.rotation.x = 0;
            clouds.rotation.y = earth.rotation.y;
            clouds.rotation.x = 0;
        }
        getLocation();

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 0.25);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
        directionalLight.position.set(0, 0, 10);
        scene.add(directionalLight);

        // Adjust sun position for day/night based on current time
        function updateSunPosition() {
            // Get time from slider or current time
            const sliderMinutes = parseInt(timeSlider.value);
            const today = new Date();
            const now = new Date(today.getFullYear(), today.getMonth(), today.getDate(),
                Math.floor(sliderMinutes / 60), sliderMinutes % 60, 0);
            // Minutes since UTC midnight
            const utcMinutes = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;

            // Day of year and fractional year (gamma)
            const doy = getDayOfYear(now);
            const gamma = 2 * Math.PI / 365 * (doy - 1 + utcMinutes / 1440);

            // NOAA equation of time (minutes) and solar declination (radians)
            const eqTime = 229.18 * (
                0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
                - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma)
            );
            const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
                - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
                - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma);

            // Subsolar longitude (degrees, East positive)
            // Calculate subsolar longitude (sun moves west as time progresses)
            let subsolarLon = -(utcMinutes - 720 + eqTime) * 0.25;

            // Use subsolar longitude directly (no offset needed)
            let sunLon = subsolarLon;
            // Normalize to [-180, 180]
            subsolarLon = ((subsolarLon + 540) % 360) - 180;

            // Convert subsolar point to unit vector (ECEF)
            const lat = decl; // radians
            const lon = sunLon * Math.PI / 180;
            const x = Math.cos(lat) * Math.cos(lon);
            const y = Math.sin(lat);
            const z = -Math.cos(lat) * Math.sin(lon);

            // Position directional light directly (sun doesn't rotate with Earth)
            directionalLight.position.set(x * 10, y * 10, z * 10);
            directionalLight.intensity = 1.5;
            ambientLight.intensity = 0.2;

            // Update shader uniform with sun direction in object space
            // Using object space ensures lighting stays fixed to Earth's surface
            earthMaterial.uniforms.sunDirection.value.set(x, y, z);

            // Update display
            updateTimeDisplay(now);
        }

        function updateTimeDisplay(now) {
            const localTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const utcTime = now.toUTCString().split(' ')[4].substring(0, 5);

            document.getElementById('currentTime').textContent = `${localTime} (${utcTime} UTC)`;
        }

        // Camera position
        camera.position.set(0, 0, 15);
        camera.lookAt(0, 0, 0);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, 0, 0);
        controls.minDistance = 7;  // Prevent zooming inside Earth (radius 5)
        controls.maxDistance = 50; // Optional zoom out limit

        // Time control setup
        const timeSlider = document.getElementById('timeSlider');

        // Initialize slider to current time
        const initNow = new Date();
        const initMinutes = initNow.getHours() * 60 + initNow.getMinutes();
        timeSlider.value = initMinutes;

        // Performance optimization: track when sun calculation is needed
        let lastSliderValue = timeSlider.value;
        let needsSunUpdate = true;

        // Add slider input listener for immediate updates
        timeSlider.addEventListener('input', () => {
            needsSunUpdate = true;
        });



        // Animation
        function animate() {
            requestAnimationFrame(animate);
            
            // Only update sun position when slider changes (HUGE performance gain)
            const currentSliderValue = timeSlider.value;
            if (needsSunUpdate || currentSliderValue !== lastSliderValue) {
                updateSunPosition();
                lastSliderValue = currentSliderValue;
                needsSunUpdate = false;
            }
            
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>

</html>
