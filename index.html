<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        canvas {
            display: none;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            min-width: 300px;
        }

        .slider-container {
            margin: 10px 0;
        }

        .slider-container-title {
            justify-content: space-between;
            display: flex;
        }

        .slider {
            width: 100%;
            margin: 8px 0;
        }

        .time-display {
            font-size: 14px;
            margin: 5px 0;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            max-width: 200px;
        }

        .instructions h4 {
            margin: 0 0 8px 0;
            font-size: 14px;
        }

        .instructions ul {
            margin: 0;
            padding-left: 15px;
        }

        .instructions li {
            margin: 4px 0;
        }
    </style>
</head>

<body>
    <div class="controls">


        <div class="slider-container">
            <div class="slider-container-title">
                <label for="timeSlider">Time control</label>
                <span class="time-display">
                    <span id="currentTime">--:-- <span class="time-display-utc">(--:-- UTC)</span></span>
                </span>
            </div>
            <input type="range" id="timeSlider" class="slider" min="0" max="1440" value="720" step="15">
        </div>

        <div class="slider-container">
            <label>
                <input type="checkbox" id="cloudToggle" checked> Show clouds
            </label>
        </div>
    </div>

    <div class="instructions">
        <h4>Controls</h4>
        <ul>
            <li>Drag to rotate Earth</li>
            <li>Scroll to zoom in/out</li>
            <li>Use slider to change time</li>
        </ul>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js" integrity="sha384-wagZhIFgY4hD+7awjQjR4e2E294y6J2HSnd8eTNc15ZubTeQeVRZwhQJ+W6hnBsf" crossorigin="anonymous"></script>
    <script>
        // ==========================================
        // CONFIGURATION
        // ==========================================
        
        const CONFIG = {
            // Earth physical properties
            EARTH_RADIUS: 5,
            CLOUD_RADIUS: 5.05,
            
            // Time constants
            UTC_NOON_MINUTES: 720,  // 12:00 UTC in minutes
            MINUTES_PER_DAY: 1440,  // 24 hours * 60 minutes
            DEGREES_PER_MINUTE: 0.25,  // Earth rotation: 360° / 1440 minutes
            SLIDER_STEP: 15,  // 15-minute increments
            
            // Geometry quality
            GEOMETRY_HIGH: 64,
            GEOMETRY_MEDIUM: 48,
            GEOMETRY_LOW: 32,
            
            // Camera settings
            CAMERA_FOV: 75,
            CAMERA_NEAR: 0.1,
            CAMERA_FAR: 1000,
            INITIAL_CAMERA_DISTANCE: 15,
            MIN_ZOOM_DISTANCE: 7,
            MAX_ZOOM_DISTANCE: 50,
            
            // Lighting
            AMBIENT_LIGHT_INTENSITY: 0.25,
            DIRECTIONAL_LIGHT_INTENSITY: 1.5,
            SUN_DISTANCE: 10,
            
            // Visual effects
            CLOUD_OPACITY: 0.3,
            DAY_NIGHT_TRANSITION: { min: -0.1, max: 0.1 },  // smoothstep range
            
            // Default location (Stockholm)
            DEFAULT_LONGITUDE: 18,
            DEFAULT_LATITUDE: 59,
            
            // Controls
            DAMPING_FACTOR: 0.05
        };

        // ==========================================
        // GLOBAL VARIABLES
        // ==========================================
        
        let scene, camera, renderer, controls;
        let earth, clouds, earthMaterial;
        let ambientLight, directionalLight;
        let userLongitude = CONFIG.DEFAULT_LONGITUDE;
        let userLatitude = CONFIG.DEFAULT_LATITUDE;
        let timeSlider, lastSliderValue, needsSunUpdate = true;

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================

        function checkWebGLSupport() {
            try {
                const canvas = document.createElement('canvas');
                return !!(window.WebGLRenderingContext && 
                         (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
            } catch(e) {
                return false;
            }
        }

        function showError(title, message) {
            document.body.innerHTML = `
                <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                           text-align: center; color: white; font-family: Arial, sans-serif;">
                    <h2>${title}</h2>
                    <p>${message}</p>
                </div>`;
        }

        function getDayOfYear(date) {
            try {
                if (!date || !(date instanceof Date) || isNaN(date.getTime())) {
                    console.warn('Invalid date provided to getDayOfYear, using current date');
                    date = new Date();
                }
                
                const startUTC = Date.UTC(date.getUTCFullYear(), 0, 1);
                const nowUTC = Date.UTC(
                    date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate(),
                    date.getUTCHours(), date.getUTCMinutes(), date.getUTCSeconds()
                );
                const oneDay = 1000 * 60 * 60 * 24;
                const dayOfYear = Math.floor((nowUTC - startUTC) / oneDay) + 1;
                
                // Validate result (should be 1-366)
                return (dayOfYear >= 1 && dayOfYear <= 366) ? dayOfYear : 1;
            } catch (error) {
                console.error('Error calculating day of year:', error);
                return 1; // Fallback to January 1st
            }
        }

        // ==========================================
        // INITIALIZATION & SETUP
        // ==========================================

        function initWebGL() {
            if (!checkWebGLSupport()) {
                showError('WebGL Not Supported', 
                         'This application requires WebGL to display 3D graphics.<br>' +
                         'Please update your browser or enable WebGL in settings.');
                throw new Error('WebGL not supported');
            }
        }

        function initScene() {
            try {
                scene = new THREE.Scene();
                camera = new THREE.PerspectiveCamera(
                    CONFIG.CAMERA_FOV, 
                    window.innerWidth / window.innerHeight, 
                    CONFIG.CAMERA_NEAR, 
                    CONFIG.CAMERA_FAR
                );
                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setClearColor(0x000000, 1);
                document.body.appendChild(renderer.domElement);
                
                console.log('Scene initialized successfully');
            } catch (error) {
                console.error('Failed to initialize WebGL renderer:', error);
                showError('Graphics Initialization Failed',
                         'Unable to start the 3D graphics system.<br>' +
                         'Please refresh the page or try a different browser.');
                throw error;
            }
        }



        // ==========================================
        // 3D OBJECTS & MATERIALS
        // ==========================================

        function initEarth() {
            const loadingManager = new THREE.LoadingManager();
            
            loadingManager.onLoad = () => {
                console.log('All textures loaded successfully');
                renderer.domElement.style.display = 'block';
            };
            
            loadingManager.onError = (url) => {
                console.error('Failed to load texture:', url);
                renderer.domElement.style.display = 'block';
            };
            
            const textureLoader = new THREE.TextureLoader(loadingManager);

            // Responsive geometry based on device capabilities
            const devicePixelRatio = window.devicePixelRatio || 1;
            const isHighDPI = devicePixelRatio > 1.5;
            const isLargeScreen = window.innerWidth > 1200;
            
            const segments = (isHighDPI && isLargeScreen) ? CONFIG.GEOMETRY_HIGH : 
                            (isHighDPI || isLargeScreen) ? CONFIG.GEOMETRY_MEDIUM : 
                            CONFIG.GEOMETRY_LOW;
            console.log(`Using ${segments}x${segments} geometry segments (${segments * segments * 2} triangles)`);
            
            const earthGeometry = new THREE.SphereGeometry(CONFIG.EARTH_RADIUS, segments, segments);

            // Load Earth textures - High Resolution local files
            const dayTexture = textureLoader.load(
                'textures/earth_day.jpg',
                undefined, undefined, (err) => console.warn('Day texture failed')
            );
            const normalTexture = textureLoader.load(
                'textures/earth_normal.jpg',
                undefined, undefined, (err) => console.warn('Normal texture failed')
            );
            const specularTexture = textureLoader.load(
                'textures/earth_specular.jpg',
                undefined, undefined, (err) => console.warn('Specular texture failed')
            );
            const nightTexture = textureLoader.load(
                'textures/earth_night.jpg',
                undefined, undefined, (err) => console.warn('Night lights texture failed')
            );

            // Earth shader material
            earthMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    dayTexture: { value: dayTexture },
                    nightTexture: { value: nightTexture },
                    normalTexture: { value: normalTexture },
                    specularTexture: { value: specularTexture },
                    sunDirection: { value: new THREE.Vector3(1, 0, 0) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vUv = uv;
                        vNormal = normalize(normalMatrix * normal);
                        vPosition = position;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D dayTexture;
                    uniform sampler2D nightTexture;
                    uniform sampler2D normalTexture;
                    uniform sampler2D specularTexture;
                    uniform vec3 sunDirection;
                    
                    varying vec2 vUv;
                    varying vec3 vNormal;
                    varying vec3 vPosition;
                    
                    void main() {
                        vec4 dayColor = texture2D(dayTexture, vUv);
                        vec4 nightColor = texture2D(nightTexture, vUv);
                        
                        vec3 objectNormal = normalize(vPosition);
                        float sunDot = dot(objectNormal, normalize(sunDirection));
                        
                        float mixFactor = smoothstep(${CONFIG.DAY_NIGHT_TRANSITION.min}, ${CONFIG.DAY_NIGHT_TRANSITION.max}, sunDot);
                        vec4 finalColor = mix(nightColor, dayColor, mixFactor);
                        
                        gl_FragColor = finalColor;
                    }
                `
            });

            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            scene.add(earth);

            // Clouds
            const cloudsGeometry = new THREE.SphereGeometry(CONFIG.CLOUD_RADIUS, segments, segments);
            const cloudTexture = textureLoader.load(
                'textures/earth_clouds.jpg',
                undefined, undefined, (err) => console.warn('Cloud texture failed')
            );
            const cloudsMaterial = new THREE.MeshLambertMaterial({
                map: cloudTexture,
                transparent: true,
                opacity: CONFIG.CLOUD_OPACITY
            });
            clouds = new THREE.Mesh(cloudsGeometry, cloudsMaterial);
            scene.add(clouds);
        }

        function initLighting() {
            // Lights
            ambientLight = new THREE.AmbientLight(0x404040, CONFIG.AMBIENT_LIGHT_INTENSITY);
            scene.add(ambientLight);

            directionalLight = new THREE.DirectionalLight(0xffffff, CONFIG.DIRECTIONAL_LIGHT_INTENSITY);
            directionalLight.position.set(0, 0, CONFIG.SUN_DISTANCE);
            scene.add(directionalLight);
        }

        function initControls() {
            // Camera position
            camera.position.set(0, 0, CONFIG.INITIAL_CAMERA_DISTANCE);
            camera.lookAt(0, 0, 0);

            // Orbit controls
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = CONFIG.DAMPING_FACTOR;
            controls.target.set(0, 0, 0);
            controls.minDistance = CONFIG.MIN_ZOOM_DISTANCE;
            controls.maxDistance = CONFIG.MAX_ZOOM_DISTANCE;
        }

        // ==========================================
        // GEOLOCATION & LOCATION HANDLING
        // ==========================================

        function getLocation() {
            if (!navigator.geolocation) {
                console.log('Geolocation not supported, using default location');
                updateEarthRotation();
                return;
            }

            const options = {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 300000
            };

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    
                    if (lat >= -90 && lat <= 90 && lon >= -180 && lon <= 180) {
                        userLongitude = lon;
                        userLatitude = lat;
                        console.log(`Geolocation success: ${lat.toFixed(2)}°N, ${lon.toFixed(2)}°E`);
                        updateEarthRotation();
                    } else {
                        console.warn('Invalid coordinates received, using default location');
                        updateEarthRotation();
                    }
                },
                (error) => {
                    let errorMsg = 'Geolocation failed: ';
                    switch(error.code) {
                        case error.PERMISSION_DENIED: errorMsg += 'Permission denied'; break;
                        case error.POSITION_UNAVAILABLE: errorMsg += 'Position unavailable'; break;
                        case error.TIMEOUT: errorMsg += 'Request timed out'; break;
                        default: errorMsg += 'Unknown error';
                    }
                    console.log(errorMsg + ', using default location');
                    updateEarthRotation();
                },
                options
            );
        }

        function updateEarthRotation() {
            // Center user's longitude at camera by yawing Earth
            earth.rotation.y = -(Math.PI / 2) - (userLongitude * Math.PI / 180);
            earth.rotation.x = 0;
            clouds.rotation.y = earth.rotation.y;
            clouds.rotation.x = 0;
        }

        // ==========================================
        // ASTRONOMY & SUN POSITIONING
        // ==========================================

        function updateSunPosition() {
            // Get time from slider
            const sliderMinutes = parseInt(timeSlider.value);
            const today = new Date();
            const now = new Date(today.getFullYear(), today.getMonth(), today.getDate(),
                Math.floor(sliderMinutes / 60), sliderMinutes % 60, 0);
            
            // Minutes since UTC midnight
            const utcMinutes = now.getUTCHours() * 60 + now.getUTCMinutes() + now.getUTCSeconds() / 60;

            // Day of year and fractional year (gamma)
            const doy = getDayOfYear(now);
            const gamma = 2 * Math.PI / 365 * (doy - 1 + utcMinutes / 1440);

            // NOAA equation of time (minutes) and solar declination (radians)
            const eqTime = 229.18 * (
                0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
                - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma)
            );
            const decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
                - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
                - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma);

            // Calculate subsolar longitude (sun moves west as time progresses)
            let subsolarLon = -(utcMinutes - CONFIG.UTC_NOON_MINUTES + eqTime) * CONFIG.DEGREES_PER_MINUTE;
            let sunLon = subsolarLon;
            subsolarLon = ((subsolarLon + 540) % 360) - 180;

            // Convert to 3D coordinates
            const lat = decl; // radians
            const lon = sunLon * Math.PI / 180;
            const x = Math.cos(lat) * Math.cos(lon);
            const y = Math.sin(lat);
            const z = -Math.cos(lat) * Math.sin(lon);

            // Update lighting
            directionalLight.position.set(x * CONFIG.SUN_DISTANCE, y * CONFIG.SUN_DISTANCE, z * CONFIG.SUN_DISTANCE);
            directionalLight.intensity = CONFIG.DIRECTIONAL_LIGHT_INTENSITY;
            ambientLight.intensity = CONFIG.AMBIENT_LIGHT_INTENSITY;

            // Update shader
            earthMaterial.uniforms.sunDirection.value.set(x, y, z);

            // Update UI
            updateTimeDisplay(now);
        }

        // ==========================================
        // USER INTERFACE
        // ==========================================

        function updateTimeDisplay(now) {
            try {
                if (!now || !(now instanceof Date) || isNaN(now.getTime())) {
                    console.warn('Invalid date provided to updateTimeDisplay');
                    now = new Date();
                }
                
                const localTime = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const utcTime = now.toUTCString().split(' ')[4].substring(0, 5);
                
                const timeElement = document.getElementById('currentTime');
                if (timeElement) {
                    timeElement.textContent = `${localTime} (${utcTime} UTC)`;
                }
            } catch (error) {
                console.error('Error updating time display:', error);
                const timeElement = document.getElementById('currentTime');
                if (timeElement) {
                    timeElement.textContent = '--:-- (--:-- UTC)';
                }
            }
        }

        function initTimeControls() {
            timeSlider = document.getElementById('timeSlider');
            const cloudToggle = document.getElementById('cloudToggle');
            
            if (!timeSlider || !cloudToggle) {
                console.error('Time slider or cloud toggle element not found');
                throw new Error('Required UI elements missing');
            }
            
            // Configure slider
            timeSlider.min = 0;
            timeSlider.max = CONFIG.MINUTES_PER_DAY;
            timeSlider.step = CONFIG.SLIDER_STEP;

            // Initialize to current time
            const initNow = new Date();
            let initMinutes = initNow.getHours() * 60 + initNow.getMinutes();
            initMinutes = Math.max(0, Math.min(CONFIG.MINUTES_PER_DAY - 1, initMinutes));
            timeSlider.value = initMinutes;

            // Performance tracking
            lastSliderValue = timeSlider.value;
            needsSunUpdate = true;

            // Event listeners
            timeSlider.addEventListener('input', (event) => {
                try {
                    const value = parseInt(event.target.value);
                    if (isNaN(value) || value < 0 || value >= CONFIG.MINUTES_PER_DAY) {
                        console.warn('Invalid slider value, clamping to valid range');
                        event.target.value = Math.max(0, Math.min(CONFIG.MINUTES_PER_DAY - 1, value || 0));
                    }
                    needsSunUpdate = true;
                } catch (error) {
                    console.error('Error handling slider input:', error);
                }
            });

            // Cloud toggle event listener
            cloudToggle.addEventListener('change', (event) => {
                try {
                    if (clouds) {
                        clouds.visible = event.target.checked;
                    }
                } catch (error) {
                    console.error('Error handling cloud toggle:', error);
                }
            });
        }

        // ==========================================
        // ANIMATION & RENDERING
        // ==========================================



        function animate() {
            try {
                requestAnimationFrame(animate);
                
                // Only update sun position when slider changes (performance optimization)
                const currentSliderValue = timeSlider.value;
                if (needsSunUpdate || currentSliderValue !== lastSliderValue) {
                    updateSunPosition();
                    lastSliderValue = currentSliderValue;
                    needsSunUpdate = false;
                }
                
                if (controls) controls.update();
                if (renderer && scene && camera) {
                    renderer.render(scene, camera);
                }
            } catch (error) {
                console.error('Animation error:', error);
                requestAnimationFrame(animate);
            }
        }

        function initEventListeners() {
            // Handle window resize
            window.addEventListener('resize', () => {
                try {
                    if (camera && renderer) {
                        camera.aspect = window.innerWidth / window.innerHeight;
                        camera.updateProjectionMatrix();
                        renderer.setSize(window.innerWidth, window.innerHeight);
                    }
                } catch (error) {
                    console.error('Error handling window resize:', error);
                }
            });
        }

        // ==========================================
        // APPLICATION INITIALIZATION
        // ==========================================

        function initApp() {
            try {
                console.log('Initializing 3D Earth visualization...');
                
                // Initialize all systems
                initWebGL();
                initScene();
                initEarth();
                initLighting();
                initControls();
                initTimeControls();
                initEventListeners();
                
                // Start location detection and animation
                getLocation();
                animate();
                
                console.log('Application initialized successfully');
            } catch (error) {
                console.error('Failed to initialize application:', error);
                document.body.innerHTML += `
                    <div style="position: fixed; bottom: 20px; left: 20px; 
                               background: rgba(255, 0, 0, 0.8); color: white; 
                               padding: 10px; border-radius: 5px; font-family: Arial, sans-serif;">
                        <strong>Error:</strong> Application failed to start. Check console for details.
                    </div>`;
            }
        }

        // Start the application
        initApp();
    </script>
</body>

</html>
